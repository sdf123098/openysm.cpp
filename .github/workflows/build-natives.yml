name: Build native binaries

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build all supported targets
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore release line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf true
          git reset --hard

      - name: Set up Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.16.0

      - name: Set up Java for Android cmdline tools
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android NDK
        shell: pwsh
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Build native libraries
        shell: pwsh
        run: |
          $ndk = "$env:ANDROID_HOME\ndk\25.2.9519653"
          zig build -Dplatform=all -Drelease -Dandroid-ndk="$ndk"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path zig-out).Path
          $lines = Get-ChildItem -LiteralPath $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $relative = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
              "$hash  $relative"
            }
          $lines | Set-Content -LiteralPath zig-out/SHA256SUMS -Encoding ascii

      - name: Upload native libraries and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ysm-core-${{ github.sha }}
          path: zig-out/
          if-no-files-found: error
          retention-days: 90
